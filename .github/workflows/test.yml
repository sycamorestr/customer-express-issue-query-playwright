name: Offline regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install fixed Python dependencies
        run: |
          python -m pip install --only-binary=:all: -r skills/customer-express-issue-query-playwright/scripts/requirements.txt
      - name: Excel and checkpoint tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Query adapter tests
        run: node --test tests/test_query.js
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            $parseTokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
